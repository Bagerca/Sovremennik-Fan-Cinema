<!DOCTYPE html>
<html lang="ru" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр «Современник»</title>
    
    <!-- Модульный CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/rules.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/theme-effects.css">

    <!-- Динамический Favicon управляется через JS -->
    <link id="dynamic-favicon" rel="icon" href="" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Шапка (статична) -->
    <header id="app-header">
        <div class="header-fluid">
            <a href="#/" class="logo-link" id="logo-container"></a>
            <nav class="nav-links">
                <a href="#/" data-route="/">О нас</a>
                <a href="#/schedule" data-route="/schedule">Расписание</a>
                <a href="#/library" data-route="/library">Фильмы</a>
                <a href="#/rules" data-route="/rules">Правила</a>
                <button id="theme-toggle-btn" class="theme-toggle-btn" title="Переключить тему"></button>
            </nav>
        </div>
    </header>

    <!-- Главный контейнер для SPA (динамика) -->
    <main class="container" id="app-main"></main>

    <!-- Подвал (статичен) -->
    <footer id="app-footer">
        <div class="footer-container">
            <div class="footer-info">
                <p class="copyright">© 2005 — <span id="current-year"></span>, Кинотеатр «Современник»</p>
                <a href="#/" class="address-link">
                    <span id="icon-location"></span>
                    <span>Ленинградская обл., г. Сосновый Бор, ул. Комсомольская, д. 17</span>
                </a>
            </div>
            <div class="footer-socials">
                <a href="https://vk.com/sushikinno" target="_blank" class="social-btn vk-btn" id="icon-vk"></a>
                <a href="https://t.me/sushikinno" target="_blank" class="social-btn tg-btn" id="icon-tg"></a>
            </div>
        </div>
    </footer>

    <!-- Контейнеры для эффектов и модалок -->
    <div id="theme-effects-root"></div>
    <div id="modal-root"></div>

    <!-- Разделенные данные -->
    <script src="data/cinemaInfo.js"></script>
    <script src="data/promotions.js"></script>
    <script src="data/library.js"></script>
    <script src="data/schedule.js"></script>
    
    <!-- JS Модули -->
    <script src="js/utils/icons.js"></script>
    <script src="js/utils/helpers.js"></script>
    
    <script src="js/core/store.js"></script>
    <script src="js/core/router.js"></script>
    
    <script src="js/components/modal.js"></script>
    <script src="js/components/hallScheme.js"></script>
    <script src="js/components/themeEffects.js"></script>
    
    <script src="js/views/aboutView.js"></script>
    <script src="js/views/scheduleView.js"></script>
    <script src="js/views/libraryView.js"></script>
    <script src="js/views/rulesView.js"></script>
    
    <script src="js/app.js"></script>
</body>
</html>
